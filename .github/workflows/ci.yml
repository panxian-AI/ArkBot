name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .[dev]

      - name: E2E — single channel
        run: python tests/e2e/e2e_test.py

      - name: E2E — dual-channel failover (anti-ban)
        run: python tests/e2e/failover_test.py

      - name: E2E — OneBot upper-layer compatibility
        run: python tests/e2e/compat_test.py

      - name: E2E — NG kernel legacy-plugin compatibility
        run: python tests/e2e/arkbot2_compat_test.py

      - name: Persistence smoke
        run: python tests/e2e/persist_test.py

      - name: E2E — chat integrations (AstrBot / DSH)
        run: python tests/e2e/ai_chat_test.py

      - name: Unit tests
        run: pytest tests/unit -q
